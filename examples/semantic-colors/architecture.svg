<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="semantic-architecture-title semantic-architecture-desc">
<title id="semantic-architecture-title">文档处理服务 · 架构图</title>
<desc id="semantic-architecture-desc">虚构示例：上传门户经接入 API 调用解析服务，解析服务调用格式归一与 AI 分析，分析服务调用敏感处理并写入结果库，结果供报告门户读取；五色表示职责，解析服务是唯一焦点。</desc>
<defs><style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<marker id="semantic-architecture-arrow-input" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#1e40af"/></marker>
<marker id="semantic-architecture-arrow-process" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#b45309"/></marker>
<marker id="semantic-architecture-arrow-data" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#166534"/></marker>
<marker id="semantic-architecture-arrow-analysis" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#6b21a8"/></marker>
<marker id="semantic-architecture-arrow-sensitive" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#9d174d"/></marker>
<marker id="semantic-architecture-arrow-neutral" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker>
</defs>
