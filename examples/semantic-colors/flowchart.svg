<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120" role="img" aria-labelledby="semantic-flowchart-title semantic-flowchart-desc">
<title id="semantic-flowchart-title">文档处理服务 · 流程图</title>
<desc id="semantic-flowchart-desc">虚构示例：文档提交并校验后经过解析和格式归一，判断是否含敏感内容；有则脱敏，无则直接进入 AI 分析，两路合并后保存结果并提供报告；敏感内容判断是唯一焦点。</desc>
<defs><style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<marker id="semantic-flowchart-arrow-input" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#1e40af"/></marker>
<marker id="semantic-flowchart-arrow-process" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#b45309"/></marker>
<marker id="semantic-flowchart-arrow-data" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#166534"/></marker>
<marker id="semantic-flowchart-arrow-analysis" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#6b21a8"/></marker>
<marker id="semantic-flowchart-arrow-sensitive" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#9d174d"/></marker>
<marker id="semantic-flowchart-arrow-neutral" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker>
</defs>
<rect x="0" y="0" width="800" height="1120" rx="0" fill="#ffffff"/>
<text x="40" y="64" font-size="28" fill="#1e293b" font-weight="600" text-anchor="start">文档处理服务 · 流程图</text>
<text x="40" y="100" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">同一套语义色；这次强调决定是否脱敏的判断。</text>
<path d="M360 165 V189" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#semantic-flowchart-arrow-neutral)"/>
<path d="M360 269 V293" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#semantic-flowchart-arrow-neutral)"/>
<path d="M360 373 V397" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#semantic-flowchart-arrow-neutral)"/>
<path d="M360 477 V501" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#semantic-flowchart-arrow-neutral)"/>
<path d="M477 568 H557" fill="none" stroke="#9d174d" stroke-width="1.2" marker-end="url(#semantic-flowchart-arrow-sensitive)"/>
<path d="M360 629 V654" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#semantic-flowchart-arrow-neutral)"/>
<path d="M660 605 V656 Q660 664 652 664 H370" fill="none" stroke="#9d174d" stroke-width="1.2" marker-end="url(#semantic-flowchart-arrow-sensitive)"/>
<path d="M360 673 V693" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#semantic-flowchart-arrow-neutral)"/>
<path d="M360 773 V797" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#semantic-flowchart-arrow-neutral)"/>
<path d="M360 877 V901" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#semantic-flowchart-arrow-neutral)"/>
<rect x="492" y="536" width="48" height="24" rx="2" fill="#ffffff"/><text x="516.0" y="554" font-size="16" fill="#9d174d" font-weight="400" text-anchor="middle">是</text>
<rect x="368" y="632" width="40" height="24" rx="2" fill="#ffffff"/><text x="388.0" y="650" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">否</text>
<rect x="484" y="632" width="128" height="24" rx="2" fill="#ffffff"/><text x="548.0" y="650" font-size="16" fill="#9d174d" font-weight="400" text-anchor="middle">脱敏后继续</text>
<g data-node-id="提交文档" data-semantic-role="input">
<rect x="240" y="112" width="240" height="48" rx="20" fill="#ffffff"/>
<rect x="240" y="112" width="240" height="48" rx="20" fill="#dbeafe" stroke="#1e40af" stroke-width="1"/>
<text x="360.0" y="143.0" font-size="20" fill="#1e40af" font-weight="600" text-anchor="middle">提交文档</text>
</g>
<g data-node-id="接收与校验" data-semantic-role="input">
<rect x="240" y="200" width="240" height="64" rx="6" fill="#ffffff"/>
<rect x="240" y="200" width="240" height="64" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1"/>
<text x="360.0" y="239.0" font-size="20" fill="#1e40af" font-weight="600" text-anchor="middle">接收与校验</text>
</g>
<g data-node-id="解析文档" data-semantic-role="process">
<rect x="240" y="304" width="240" height="64" rx="6" fill="#ffffff"/>
<rect x="240" y="304" width="240" height="64" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
<text x="360.0" y="343.0" font-size="20" fill="#b45309" font-weight="600" text-anchor="middle">解析文档</text>
</g>
<g data-node-id="格式归一" data-semantic-role="process">
<rect x="240" y="408" width="240" height="64" rx="6" fill="#ffffff"/>
<rect x="240" y="408" width="240" height="64" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
<text x="360.0" y="447.0" font-size="20" fill="#b45309" font-weight="600" text-anchor="middle">格式归一</text>
</g>
<g data-node-id="敏感判断" data-semantic-role="sensitive">
<path d="M360 512 L472 568 L360 624 L248 568 Z" fill="#ffffff"/>
<path d="M360 512 L472 568 L360 624 L248 568 Z" fill="#fce7f3" stroke="#9d174d" stroke-width="1.5" data-focal="true"/>
<text x="360" y="575" font-size="20" fill="#9d174d" font-weight="700" text-anchor="middle">含敏感内容？</text>
</g>
<g data-node-id="脱敏处理" data-semantic-role="sensitive">
<rect x="568" y="536" width="184" height="64" rx="6" fill="#ffffff"/>
<rect x="568" y="536" width="184" height="64" rx="6" fill="#fce7f3" stroke="#9d174d" stroke-width="1"/>
<text x="660.0" y="575.0" font-size="20" fill="#9d174d" font-weight="600" text-anchor="middle">脱敏处理</text>
</g>
<circle cx="360" cy="664" r="4" fill="#1e293b"/>
<g data-node-id="AI 分析" data-semantic-role="analysis">
<rect x="240" y="704" width="240" height="64" rx="6" fill="#ffffff"/>
<rect x="240" y="704" width="240" height="64" rx="6" fill="#f3e8ff" stroke="#6b21a8" stroke-width="1"/>
<text x="360.0" y="743.0" font-size="20" fill="#6b21a8" font-weight="600" text-anchor="middle">AI 分析</text>
</g>
<g data-node-id="保存结果" data-semantic-role="data">
<rect x="240" y="808" width="240" height="64" rx="6" fill="#ffffff"/>
<rect x="240" y="808" width="240" height="64" rx="6" fill="#d1fae5" stroke="#166534" stroke-width="1"/>
<text x="360.0" y="847.0" font-size="20" fill="#166534" font-weight="600" text-anchor="middle">保存结果</text>
</g>
<g data-node-id="报告可用" data-semantic-role="data">
<rect x="240" y="912" width="240" height="48" rx="20" fill="#ffffff"/>
<rect x="240" y="912" width="240" height="48" rx="20" fill="#d1fae5" stroke="#166534" stroke-width="1"/>
<text x="360.0" y="943.0" font-size="20" fill="#166534" font-weight="600" text-anchor="middle">报告可用</text>
</g>
<path d="M164 568 H244" fill="none" stroke="#9d174d" stroke-width="1" stroke-dasharray="4,3"/>
<circle cx="244" cy="568" r="2" fill="#9d174d"/>
<text x="48" y="560" font-size="20" fill="#9d174d" font-weight="600" text-anchor="start">本图焦点</text>
<text x="48" y="588" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">决定是否脱敏</text>
<text x="40" y="1000" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">灰线表示顺序，粉线表示脱敏支路；菱形表示判断。</text>
<line x1="40" y1="1036" x2="760" y2="1036" stroke="#94a3b8" stroke-width="0.8"/>
<rect x="40" y="1060" width="16" height="16" rx="3" fill="#dbeafe" stroke="#1e40af" stroke-width="1"/>
<text x="64" y="1074" font-size="16" fill="#1e293b" font-weight="400" text-anchor="start">输入 / 主路径</text>
<rect x="184" y="1060" width="16" height="16" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
<text x="208" y="1074" font-size="16" fill="#1e293b" font-weight="400" text-anchor="start">处理 / 进行中</text>
<rect x="328" y="1060" width="16" height="16" rx="3" fill="#d1fae5" stroke="#166534" stroke-width="1"/>
<text x="352" y="1074" font-size="16" fill="#1e293b" font-weight="400" text-anchor="start">数据 / 输出</text>
<rect x="472" y="1060" width="16" height="16" rx="3" fill="#f3e8ff" stroke="#6b21a8" stroke-width="1"/>
<text x="496" y="1074" font-size="16" fill="#1e293b" font-weight="400" text-anchor="start">AI / 分析</text>
<rect x="616" y="1060" width="16" height="16" rx="3" fill="#fce7f3" stroke="#9d174d" stroke-width="1"/>
<text x="640" y="1074" font-size="16" fill="#1e293b" font-weight="400" text-anchor="start">敏感 / 警示</text>
</svg>
